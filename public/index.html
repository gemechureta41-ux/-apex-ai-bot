<!DOCTYPE html>
<html lang="or">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex AI - SMC Master Signal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0b0e14; color: #ffffff; }
    </style>
</head>
<body class="p-4 font-sans select-none pb-24">
    <div class="max-w-md mx-auto space-y-4">
        
        <!-- Header -->
        <div class="flex justify-between items-center px-1">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-chevron-left text-zinc-400 text-sm"></i>
                <span class="text-xs text-zinc-300 font-semibold">Apex SMC Master</span>
            </div>
            <span class="bg-amber-500/10 text-amber-400 text-xs px-2.5 py-0.5 rounded-full border border-amber-500/30">Live RR 1:4</span>
        </div>

        <h1 class="text-2xl font-bold tracking-tight">Institutional Setup</h1>

        <!-- Asset Selector -->
        <div class="bg-zinc-900/90 border border-zinc-800/80 p-3.5 rounded-2xl flex justify-between items-center shadow-lg">
            <div class="text-xs text-zinc-400 font-medium">Select Market:</div>
            <select id="asset-select" onchange="fetchSMCData()" class="bg-zinc-800 text-amber-400 font-bold text-xs px-3 py-2 rounded-xl border border-zinc-700 focus:outline-none">
                <option value="EURUSD">EUR/USD (Forex)</option>
                <option value="XAUUSD">GOLD (XAU/USD)</option>
                <option value="NAS100">NASDAQ (NAS100)</option>
                <option value="DXY">DXY (Dollar Index)</option>
            </select>
        </div>

        <!-- Signal Card -->
        <div class="bg-zinc-900/90 border border-zinc-800/80 p-5 rounded-2xl text-center space-y-2 shadow-xl">
            <div class="text-xs text-zinc-500 font-medium">ENTRY SIGNAL & STRUCTURE</div>
            <div id="signal-action" class="text-3xl font-black text-amber-400">MONITORING</div>
            <div class="text-xs text-zinc-400">Entry Price: <span id="entry-price" class="text-amber-400 font-mono font-bold">---</span></div>
        </div>

        <!-- Risk Management & TP/SL Grid -->
        <div class="grid grid-cols-2 gap-2 text-xs">
            <div class="bg-zinc-900/80 border border-zinc-800/60 p-3.5 rounded-xl">
                <div class="text-zinc-500 text-[10px]">STOP LOSS (SL)</div>
                <div class="font-bold text-rose-500 font-mono mt-1 text-sm" id="sl-val">---</div>
            </div>
            <div class="bg-zinc-900/80 border border-zinc-800/60 p-3.5 rounded-xl">
                <div class="text-zinc-500 text-[10px]">PARTIAL TP (1:2)</div>
                <div class="font-bold text-blue-400 font-mono mt-1 text-sm" id="tp1-val">---</div>
            </div>
            <div class="bg-zinc-900/80 border border-zinc-800/60 p-3.5 rounded-xl col-span-2">
                <div class="text-zinc-500 text-[10px]">FULL TARGET / TP (RR 1:4)</div>
                <div class="font-bold text-emerald-400 font-mono mt-1 text-base" id="tp2-val">---</div>
            </div>
        </div>

        <!-- Structure Details -->
        <div class="space-y-2 text-xs">
            <div class="bg-zinc-900/80 border border-zinc-800/60 p-3.5 rounded-xl flex justify-between items-center">
                <span class="text-zinc-400">4H Key Supply / Demand:</span>
                <span class="font-bold text-cyan-400" id="h4-val">Scanning Zone...</span>
            </div>
            <div class="bg-zinc-900/80 border border-zinc-800/60 p-3.5 rounded-xl flex justify-between items-center">
                <span class="text-zinc-400">15M CHoCH + FVG + OB:</span>
                <span class="font-bold text-emerald-400" id="choch-val">Waiting Setup...</span>
            </div>
        </div>

        <button onclick="fetchSMCData()" class="w-full bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-400 text-black font-extrabold py-3.5 rounded-2xl transition shadow-lg text-sm tracking-wide">
            REFRESH MASTER SIGNAL
        </button>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) tg.expand();

        async function fetchSMCData() {
            const selectedAsset = document.getElementById('asset-select').value;
            try {
                const response = await fetch(`/api/signal?symbol=${selectedAsset}`);
                const data = await response.json();

                document.getElementById('entry-price').innerText = data.entry;
                document.getElementById('sl-val').innerText = data.sl;
                document.getElementById('tp1-val').innerText = data.tp1;
                document.getElementById('tp2-val').innerText = data.tp2;
                document.getElementById('h4-val').innerText = data.structure_4h;
                document.getElementById('choch-val').innerText = data.choch_15m;
                
                const actionElem = document.getElementById('signal-action');
                actionElem.innerText = data.action;
                if(data.action === "BUY") {
                    actionElem.className = "text-3xl font-black text-emerald-400 animate-pulse";
                } else if(data.action === "SELL") {
                    actionElem.className = "text-3xl font-black text-rose-500 animate-pulse";
                } else {
                    actionElem.className = "text-3xl font-black text-amber-400";
                }
            } catch (err) {
                console.log("Error fetching data");
            }
        }

        setInterval(fetchSMCData, 5000);
    </script>
</body>
</html>
