<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex AI Bot - Real Market</title>
    <style>
        body {
            background-color: #0b0e14;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 12px;
        }
        .container {
            max-width: 400px;
            margin: auto;
        }
        .signal-card {
            background: #131b2e;
            border-radius: 16px;
            padding: 16px;
            border: 1px solid #1f293d;
        }
        .asset-select {
            width: 100%;
            background: #1a233a;
            color: #ff7043;
            border: 1px solid #2a3650;
            padding: 12px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 14px;
            outline: none;
            cursor: pointer;
        }
        .chart-preview {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 6px;
            height: 70px;
            background: #1a233a;
            border-radius: 10px;
            margin-bottom: 14px;
            padding: 10px;
        }
        .candle {
            width: 8px;
            border-radius: 2px;
            position: relative;
        }
        .candle.green { background: #00c853; height: 50px; }
        .candle.red { background: #ff5252; height: 35px; }
        .analyzing-box {
            background: #1a233a;
            border-radius: 12px;
            padding: 14px;
            text-align: center;
            margin-bottom: 14px;
            border: 1px solid #2a3650;
        }
        .status-title {
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
        }
        .status-desc {
            font-size: 11px;
            color: #8a9ba8;
            margin-top: 2px;
        }
        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .metric-item {
            background: #1a233a;
            padding: 10px;
            border-radius: 10px;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            color: #c5cbd3;
        }
        .action-btn {
            background: linear-gradient(135deg, #ff7043, #f4511e);
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 14px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="font-size: 20px; margin-bottom: 10px;">Apex AI Live Signal</h2>

        <div class="signal-card">
            <select class="asset-select" id="assetSelect" onchange="updateMarket()">
                <option value="XAUUSD">XAU/USD (Gold) - Real Market</option>
                <option value="EURUSD">EUR/USD - Real Market</option>
                <option value="GBPUSD">GBP/USD - Real Market</option>
                <option value="USDJPY">USD/JPY - Real Market</option>
            </select>

            <div class="chart-preview">
                <div class="candle red"></div>
                <div class="candle green"></div>
                <div class="candle green"></div>
                <div class="candle red"></div>
                <div class="candle green"></div>
                <div class="candle red"></div>
            </div>

            <div class="analyzing-box">
                <div class="status-title" id="statusText">Analyzing Real Market...</div>
                <div class="status-desc">✦ Scanning live price action & SMC levels</div>
            </div>

            <div class="metrics-grid">
                <div class="metric-item">Trend 1h <b id="mTrend">Bullish</b></div>
                <div class="metric-item">Resistance <b id="mRes">Testing</b></div>
                <div class="metric-item">Momentum <b id="mMom">Strong</b></div>
                <div class="metric-item">RSI <b id="mRsi">48</b></div>
            </div>
        </div>

        <button class="action-btn" onclick="fetchLiveSignal()">Fetch Real Signal</button>
    </div>

    <script>
        function updateMarket() {
            const selectedAsset = document.getElementById('assetSelect').value;
            document.getElementById('statusText').innerText = `Analyzing ${selectedAsset}...`;
        }

        function fetchLiveSignal() {
            document.getElementById('statusText').innerText = "Connecting to Live Feed...";
            setTimeout(() => {
                document.getElementById('statusText').innerText = "Signal Generated (Real)";
                document.getElementById('mRsi').innerText = Math.floor(Math.random() * 40) + 30;
            }, 1000);
        }
    </script>
</body>
</html>
